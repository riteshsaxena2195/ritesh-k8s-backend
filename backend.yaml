apiVersion: apps/v1
kind: Deployment
metadata:
  name: ritesh-backend-deployment
spec:
  replicas: 1                 
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: northamerica-northeast2-docker.pkg.dev/gcp-class-14/ritesh-banking-repo/ritesh-bank-backend-image:latest
        ports:
        - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: ritesh-backend-service
spec:
  type: LoadBalancer            
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80                
      targetPort: 8080          
